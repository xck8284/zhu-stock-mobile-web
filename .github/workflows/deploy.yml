name: Deploy frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy note
        run: |
          echo "Vercel auto-deploys this repo on push to main when Git integration is enabled."
          echo "Site: check Vercel dashboard for zhu-stock-mobile-web"

      - name: Optional Vercel deploy hook
        if: ${{ secrets.VERCEL_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
